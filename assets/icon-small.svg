<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- LUMEN icon, small-size variant: 3 tiles, thicker gaps for 32/64px legibility -->
  <defs>
    <linearGradient id="accent-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#4FD8FF"/>
    </linearGradient>
    <clipPath id="squircle-s">
      <rect x="64" y="64" width="896" height="896" rx="224"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle-s)">
    <rect width="1024" height="1024" fill="#141418"/>
    <rect x="192" y="192" width="240" height="640" rx="56" fill="url(#accent-s)"/>
    <rect x="464" y="192" width="368" height="288" rx="56" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
    <rect x="464" y="544" width="368" height="288" rx="56" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
  </g>
</svg>
