name: Feature request
description: Suggest a capability or a different way of doing something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do today, and where does LUMEN get in the way?
      placeholder: With 12 000 photos I can't jump to a month without scrolling for a minute.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Sketch the behavior. Rough is fine — the design pass comes later.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library / grid
        - Viewer / player
        - Search and filters
        - Settings and personalization
        - Performance
        - Import / indexing
        - Other
    validations:
      required: true

  - type: checkboxes
    id: design
    attributes:
      label: Design language
      options:
        - label: I know this would change the existing UI language (docs/DESIGN.md) and I'm fine discussing it
          required: false
