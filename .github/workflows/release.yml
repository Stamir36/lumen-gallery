name: Release

# Push a tag like `v0.2.0` → the Windows installer is built and attached to a
# draft GitHub release. Nothing is published until you review and publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      # Optional. With no certificate the installers are still built, but they
      # stay unsigned and the Microsoft Store will reject them.
      LUMEN_SIGN_PFX_BASE64: ${{ secrets.LUMEN_SIGN_PFX_BASE64 }}
      LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # tauri-action runs `pnpm tauri build` and uploads the NSIS installer
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LUMEN ${{ github.ref_name }}"
          releaseBody: |
            Windows installer (`LUMEN_*_x64-setup.exe`) — see README for what's new.
          releaseDraft: true
          prerelease: false

      # ── The Microsoft Store package ────────────────────────────────────────
      # The Store route for LUMEN is MSIX, not the linked installer above:
      # Microsoft signs an MSIX for free and hosts it, so there is no
      # certificate to buy and no download URL to keep alive. The package
      # carries nothing but lumen.exe -- a packaged app uses the machine's
      # Evergreen WebView2 runtime, so setup downloads and bundles nothing.
      # See docs/MICROSOFT-STORE.md for the one-time identity values that have
      # to be pasted into src-tauri/msix/Package.appxmanifest.
      - name: Build the Microsoft Store MSIX
        shell: pwsh
        run: |
          $options = @{}
          if ($env:LUMEN_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'lumen-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:LUMEN_SIGN_PFX_BASE64))
            $options = @{ CertificatePath = $pfx; CertificatePassword = $env:LUMEN_SIGN_PASSWORD }
          } else {
            # A throwaway certificate whose subject matches the manifest
            # Publisher: the package still has to be signed, and Partner Center
            # only checks that the signature agrees with the identity.
            $options = @{ DevCert = $true }
          }
          ./scripts/build-msix.ps1 @options

      - name: Attach the MSIX to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" src-tauri/target/msix/LUMEN_*_x64.msix --clobber
