name: Deploy site

# Publishes the static landing page in site/ to GitHub Pages.
# One-time setup: repository → Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Nothing else to configure; the URL appears in the
# workflow summary and in Settings → Pages after the first successful run.

on:
  push:
    branches: [master, main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Package site
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the site has no broken local links
        run: |
          python3 - <<'PY'
          import os, posixpath, re, sys, urllib.parse

          root = "site"
          # A GitHub Pages project site is served under /<repo>/, so the
          # root-absolute links (404.html) carry that prefix. Strip it before
          # resolving them against the site/ tree.
          prefix = "/" + os.environ.get("GITHUB_REPOSITORY", "Stamir36/lumen-gallery").split("/")[-1]

          pages = [
              posixpath.join(d.replace(os.sep, "/"), f)
              for d, _dirs, fs in os.walk(root)
              for f in fs
              if f.endswith(".html")
          ]
          missing = []

          for page in pages:
              with open(page, encoding="utf-8") as handle:
                  html = handle.read()
              for _attr, value in re.findall(r'(href|src)="([^"]+)"', html):
                  if re.match(r"^(https?:|mailto:|#|data:|//)", value):
                      continue
                  target = urllib.parse.unquote(value.split("#")[0].split("?")[0])
                  if not target:
                      continue
                  if target.startswith("/"):
                      rel = target[len(prefix):].lstrip("/") if target in (prefix, prefix + "/") or target.startswith(prefix + "/") else target.lstrip("/")
                      resolved = posixpath.join(root, rel)
                  else:
                      resolved = posixpath.normpath(posixpath.join(posixpath.dirname(page), target))
                  if os.path.isdir(resolved):
                      resolved = posixpath.join(resolved, "index.html")
                  if not os.path.exists(resolved):
                      missing.append(f"{page}: {value}")

          if missing:
              print("Broken local references:")
              print("\n".join(missing))
              sys.exit(1)
          print(f"{len(pages)} pages checked, all local references resolve.")
          PY

      # Pages has to be switched on once in the repository settings, and the
      # Actions token cannot do it for us: creating a Pages site needs more than
      # GITHUB_TOKEN is allowed (`enablement: true` fails with "Resource not
      # accessible by integration"). So we check instead of failing: the build
      # stays green, the deploy is skipped, and the run summary says what to
      # click. Probe both with and without the token, so a token that lacks
      # Pages read rights cannot silently disable the deployment.
      - name: Is Pages enabled?
        id: pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          auth=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "$url")
          anon=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' "$url")
          echo "authenticated=$auth anonymous=$anon"
          if [ "$auth" = "200" ] || [ "$anon" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages is not switched on yet"
              echo ""
              echo "The site built fine and the artifact is attached to this run, but there"
              echo "is no Pages site to publish it to. One-time setup:"
              echo ""
              echo "1. Repository **Settings** → **Pages** → *Build and deployment*"
              echo "2. Set **Source** to **GitHub Actions**"
              echo "3. Re-run this workflow: *Actions → Deploy site → Run workflow*"
              echo ""
              echo "The address will then be https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z').github.io/${GITHUB_REPOSITORY#*/}/"
              echo "(plus /ru/ and /privacy/), and it appears under Settings → Pages."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    # Skipped, not failed, until someone enables Pages in the repository settings
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
