    <!-- wide top tile -->
    <rect x="416" y="192" width="416" height="192" rx="48" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <!-- small middle tile -->
    <rect x="416" y="416" width="192" height="192" rx="48" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <!-- small bottom tile -->
    <rect x="416" y="640" width="192" height="192" rx="48" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <!-- medium vertical tile -->
    <rect x="640" y="416" width="192" height="416" rx="48" fill="#1E1E24" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
